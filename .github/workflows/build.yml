name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      # code signing runs only when the certificate is in the repository's secrets (see README, "Code signing")
      SIGNING: ${{ secrets.SIGN_CERT_PFX != '' && secrets.SIGN_CERT_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/DynamicIsland.Tests -c Release

      - name: Publish (self-contained, win-x64)
        run: dotnet publish DynamicIsland.csproj -c Release -r win-x64 --self-contained true -o publish/DynamicIsland

      - name: Signing certificate
        if: env.SIGNING == 'true'
        shell: pwsh
        env:
          SIGN_CERT_PFX: ${{ secrets.SIGN_CERT_PFX }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          "SIGN_PFX=$pfx" >> $env:GITHUB_ENV
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV

      - name: Sign the app
        if: env.SIGNING == 'true'
        shell: pwsh
        env:
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
          SIGN_TIMESTAMP_URL: ${{ secrets.SIGN_TIMESTAMP_URL }}
        run: |
          $ts = if ($env:SIGN_TIMESTAMP_URL) { $env:SIGN_TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }
          & $env:SIGNTOOL sign /f $env:SIGN_PFX /p $env:SIGN_CERT_PASSWORD /fd SHA256 /tr $ts /td SHA256 /d Atoll `
            publish/DynamicIsland/DynamicIsland.exe publish/DynamicIsland/DynamicIsland.dll
          if ($LASTEXITCODE -ne 0) { throw "signtool failed: $LASTEXITCODE" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/DynamicIsland -DestinationPath DynamicIsland-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-win-x64
          path: DynamicIsland-win-x64.zip

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          [xml]$proj = Get-Content DynamicIsland.csproj
          $ver = ($proj.Project.PropertyGroup | Where-Object Version | Select-Object -First 1).Version
          & $iscc /Q "/DAppVer=$ver" installer/DynamicIsland.iss

      - name: Sign the installer
        if: env.SIGNING == 'true'
        shell: pwsh
        env:
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
          SIGN_TIMESTAMP_URL: ${{ secrets.SIGN_TIMESTAMP_URL }}
        run: |
          $ts = if ($env:SIGN_TIMESTAMP_URL) { $env:SIGN_TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }
          & $env:SIGNTOOL sign /f $env:SIGN_PFX /p $env:SIGN_CERT_PASSWORD /fd SHA256 /tr $ts /td SHA256 /d Atoll (Get-ChildItem dist/*-setup.exe).FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool failed: $LASTEXITCODE" }

      - name: Remove the certificate
        if: always() && env.SIGNING == 'true'
        shell: pwsh
        run: if ($env:SIGN_PFX) { Remove-Item $env:SIGN_PFX -Force -ErrorAction SilentlyContinue }

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-setup
          path: dist/*-setup.exe
